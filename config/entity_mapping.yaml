# 血液病知识图谱 V1 — 实体标准化映射
# 用途：把各数据源的疾病/基因标识统一到 V1 canonical_id
# 核验日期：2026-11-09
# 核验方式：Open Targets Platform GraphQL v4 实测（dataVersion 26.09）
# 规则：禁止用名称模糊匹配代替 ID 映射；无法映射时保留 null 并写明依据

version: "1.0"
verified_at: "2026-11-09"
open_targets:
  endpoint: "https://api.platform.opentargets.org/api/v4/graphql"
  data_version: "26.09"
  note: "OT 使用下划线格式 ID（MONDO_xxx / EFO_xxx），不接受冒号格式"

diseases:
  - seed_key: "AML"
    canonical_id: "MONDO:0018874"
    name: "acute myeloid leukemia"
    open_targets_id: "MONDO_0018874"
    in_graph: true

  - seed_key: "APL"
    canonical_id: "MONDO:0012883"
    name: "acute promyelocytic leukemia"
    open_targets_id: "MONDO_0012883"
    in_graph: true

  - seed_key: "ALL"
    canonical_id: "MONDO:0004967"
    name: "acute lymphoblastic leukemia"
    open_targets_id: "MONDO_0004967"
    in_graph: true

  - seed_key: "CML"
    canonical_id: "MONDO:0011996"
    name: "chronic myeloid leukemia"
    open_targets_id: "MONDO_0011996"
    in_graph: true

  - seed_key: "CLL"
    canonical_id: "MONDO:0004948"
    name: "B-cell chronic lymphocytic leukemia"
    open_targets_id: "MONDO_0004948"
    in_graph: true

  - seed_key: "AA"
    canonical_id: "MONDO:0015909"
    name: "aplastic anemia"
    open_targets_id: "MONDO_0015909"
    in_graph: true

  - seed_key: "acquired_AA"
    canonical_id: "MONDO:0015610"
    name: "acquired aplastic anemia"
    open_targets_id: "EFO_0006926"
    in_graph: true
    mapping_note: "OT 实测不存在 MONDO_0015610；EFO_0006926 为 OT 中的 acquired aplastic anemia"

  - seed_key: "SAA"
    canonical_id: "EFO:0006927"
    name: "severe aplastic anemia"
    open_targets_id: "EFO_0006927"
    in_graph: true
    mapping_note: "MONDO 无独立 SAA 实体；Open Targets 26.09 以 EFO_0006927 提供，按任务文档“如数据源提供”纳入 V1"

dismech:
  repository: "https://github.com/monarch-initiative/dismech"
  ref: "38c23e10b0285becf70a0416fdb267698dfd20fe"
  files:
    - path: "kb/disorders/Acute_Lymphoblastic_Leukemia.yaml"
      disease_id: "MONDO:0004967"
      in_graph: true
    - path: "kb/disorders/Chronic_Myeloid_Leukemia.yaml"
      disease_id: "MONDO:0011996"
      in_graph: true
    - path: "kb/disorders/Chronic_Lymphocytic_Leukemia.yaml"
      disease_id: "MONDO:0004948"
      in_graph: true
    - path: "kb/disorders/Acute_Myeloid_Leukemia_with_CEBPA_Somatic_Mutations.yaml"
      disease_id: "MONDO:0017894"
      in_graph: false
      mapping_note: "AML 亚型；V1 不作为独立种子节点，保留原始文件供后续版本"
    - path: "kb/disorders/Inherited_Aplastic_Anemia.yaml"
      disease_id: "MONDO:0001713"
      in_graph: false
      mapping_note: "遗传性再障不与 AA 合并；该文件的 DisMech 证据不采用（in_graph: false），但 Monarch 的 SUBTYPE_OF 一跳仍将其作为关联疾病带入正式图"

